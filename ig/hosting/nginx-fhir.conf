# fhir-hub canonical resolution, part 2 of 2: the locations.
#
# These belong in the **server** context, inside the existing spec.digitalis.nl server block:
#
#     server {
#         server_name spec.digitalis.nl;
#         root        /srv/spec.digitalis.nl;      # whatever holds /fhir
#         # ... your listen / ssl_certificate directives, unchanged ...
#
#         include /etc/nginx/snippets/fhir-hub.conf;
#     }
#
# Put the file in snippets/ or anywhere that is NOT auto-included: /etc/nginx/conf.d/*.conf is
# pulled into the http context by the shipped nginx.conf, and a location block there is a syntax
# error. Part 1, hosting/nginx-maps.conf, is the file that does go in conf.d.
#
# The server block has to define `root` — it is deliberately not set here, so this include cannot
# take over a host that serves anything besides the guide. Everything below is scoped to /fhir/.
#
# WHAT THIS FILE IS FOR
#
# The IG Publisher writes each resource as a flat file — `StructureDefinition-fhirhub-Patient.html`
# and `.json`, `.xml`, `.ttl` — while the canonical on the wire is
# `http://spec.digitalis.nl/fhir/StructureDefinition/fhirhub-Patient`. These locations map one onto
# the other, so the canonical dereferences and the publisher's own intra-site links keep working
# off a single copy of each file.
#
# ON SCHEMES: the canonical is an `http` URL and stays one — it is an identifier, not a fetch
# instruction, and changing it would mean reissuing every payload in the field. Fetching is a
# separate matter and must be `https`: the HL7 validator's SSRF protection refuses a plain-http
# fetch before it makes the request, is on by default, and by its own help text "should always be
# enabled in production". A 301 from http to https that preserves the path — which is what
# spec.digitalis.nl already does — is exactly right and costs nothing: the tool that refuses http
# never issues the request, and a person or a curl following the canonical is simply upgraded.
#
# ON ORDER: nginx takes the first matching regex location, so these blocks must stay in the order
# below. The ImplementationGuide block has to precede the general one, and both have to precede
# the prefix locations.
#
# ON MODSECURITY: every location below carries `modsecurity off;`, and it is not tidiness that can
# be dropped. The publisher names the JSON, XML and TTL rendering of each profile
# `StructureDefinition-<id>.profile.json.html`, and the OWASP Core Rule Set refuses every one of
# them: rule 930130, "Restricted File Access Attempt", matches REQUEST_FILENAME against
# restricted-files.data with `@pmFromFile` — a lowercased substring match — and line 34 of that
# file is `.profile`, the shell dotfile. The guide's first release served all 45 of those pages as
# 403 while every canonical resolved fine. Because the rule runs in phase 2 it answers before the
# disk is consulted, so the tell is a path that does not exist coming back 403 rather than 404:
#
#     curl -o /dev/null -w '%{http_code}' https://spec.digitalis.nl/fhir/nothing.profile.html
#
# The guide is static files the publisher generated, with no forms, no query parameters that reach
# an application and nothing behind them to attack, so the rule set has nothing to protect here and
# a second false positive of this kind would be found the same slow way. It is disabled per
# location rather than for the server, so anything else the host serves keeps it.
#
# On an nginx WITHOUT the ModSecurity connector, delete those lines: `modsecurity` is then an
# unknown directive, and nginx refuses to start rather than warning.

charset       utf-8;
charset_types application/fhir+json application/json application/fhir+xml text/turtle text/html;

# ---------------------------------------------------------------------------------------------
# The guide's own canonical. The publisher renders no `ImplementationGuide-<id>.html`, because the
# landing page *is* that rendering — so a browser is sent there while a machine still gets the
# resource. Kept as its own location rather than as an extra try_files candidate on the general
# block: a fallback there would answer every mistyped canonical with the landing page, and a
# validator would take that HTML for a profile.
# ---------------------------------------------------------------------------------------------
location ~ "^/fhir/(?<igsnap>[0-9]+\.[0-9]+\.[0-9]+/)?ImplementationGuide/(?<igid>[A-Za-z0-9._-]{1,64})$" {
	modsecurity off;   # CRS 930130 vs `.profile` filenames — see the header

	types {
		application/fhir+json  json;
		application/fhir+xml   xml;
		text/turtle            ttl;
		text/html              html;
	}

	add_header Vary                        "Accept";
	add_header Cache-Control               $fhir_cache_control;
	add_header Access-Control-Allow-Origin "*";

	try_files /fhir/${igsnap}ImplementationGuide-$igid$fhir_variant /fhir/${igsnap}index.html =404;
}

# ---------------------------------------------------------------------------------------------
# Every other canonical, with content negotiation. The optional first capture is a versioned
# snapshot; a named capture is empty rather than unset when its group does not participate, so one
# location covers both /fhir/… and /fhir/0.1.0/….
# ---------------------------------------------------------------------------------------------
location ~ "^/fhir/(?<snapshot>[0-9]+\.[0-9]+\.[0-9]+/)?(?<rtype>StructureDefinition|ValueSet|CodeSystem|ConceptMap|CapabilityStatement|OperationDefinition|SearchParameter)/(?<rid>[A-Za-z0-9._-]{1,64})$" {
	modsecurity off;   # CRS 930130 vs `.profile` filenames — see the header

	# try_files serves a matched file inside this location, so these types apply to it.
	types {
		application/fhir+json  json;
		application/fhir+xml   xml;
		text/turtle            ttl;
		text/html              html;
	}

	add_header Vary                        "Accept";
	add_header Cache-Control               $fhir_cache_control;
	add_header Access-Control-Allow-Origin "*";

	try_files /fhir/$snapshot$rtype-$rid$fhir_variant =404;
}

# The same resources at the flat filenames the guide's own pages link to. Only the FHIR resources
# are relabelled, so the publisher's other JSON output keeps its own type.
location ~ "^/fhir/(?:[0-9]+\.[0-9]+\.[0-9]+/)?(?:StructureDefinition|ValueSet|CodeSystem|ConceptMap|ImplementationGuide|CapabilityStatement|OperationDefinition|SearchParameter)-[A-Za-z0-9._-]+\.json$" {
	modsecurity off;   # CRS 930130 vs `.profile` filenames — see the header

	types { }
	default_type application/fhir+json;

	add_header Cache-Control               $fhir_cache_control;
	add_header Access-Control-Allow-Origin "*";
}

# The package tarballs. nginx's shipped mime.types has no entry for .tgz, and a package served as
# application/octet-stream is one some tooling declines to unpack.
location ~ "^/fhir/(?:[0-9]+\.[0-9]+\.[0-9]+/)?[A-Za-z0-9._-]+\.tgz$" {
	modsecurity off;   # CRS 930130 vs `.profile` filenames — see the header

	types { }
	default_type application/gzip;

	add_header Cache-Control               $fhir_cache_control;
	add_header Access-Control-Allow-Origin "*";
}

# Pages, assets and the remaining downloads. No `types` block: one here would replace the
# inherited mime.types wholesale rather than adding to it.
location /fhir/ {
	modsecurity off;   # CRS 930130 vs `.profile` filenames — see the header

	add_header Cache-Control               $fhir_cache_control;
	add_header Access-Control-Allow-Origin "*";

	try_files $uri $uri/index.html =404;
}

# /fhir with no trailing slash is the canonical of the guide itself.
location = /fhir {
	modsecurity off;   # CRS 930130 vs `.profile` filenames — see the header

	return 301 /fhir/;
}
