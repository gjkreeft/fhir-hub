# fhir-hub canonical resolution, part 1 of 2: the negotiation maps.
#
# These belong in the **http** context, so on a Debian/Ubuntu nginx they can simply live at
#
#     /etc/nginx/conf.d/fhir-hub-maps.conf
#
# which the shipped nginx.conf already includes at http level. Part 2, hosting/nginx-fhir.conf,
# holds the location blocks and must NOT go in conf.d — see its own header.
#
# Nothing here is specific to spec.digitalis.nl; the maps only turn a request into a filename
# suffix.

# Which representation a canonical URL resolves to.
#
# nginx takes the first matching regex in the order written, and the order below is not cosmetic:
# a browser's Accept is
#
#     text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
#
# which contains `application/xml`. Put the xml rule above text/html and every browser is handed a
# raw XML file for a profile it asked to read — the same trap as the CapabilityStatement rendering
# in config/FhirConfig, one layer down.
map $http_accept $fhir_variant_from_accept {
	default                     ".html";
	"~*text/html"               ".html";
	"~*application/fhir\+json"  ".json";
	"~*application/json"        ".json";
	"~*application/fhir\+xml"   ".xml";
	"~*application/xml"         ".xml";
	"~*text/turtle"             ".ttl";
}

# ?_format= wins over Accept, as it does on the API itself.
map $arg__format $fhir_variant {
	default                  $fhir_variant_from_accept;
	"json"                   ".json";
	"xml"                    ".xml";
	"ttl"                    ".ttl";
	"html"                   ".html";
	# The long forms only match when a client sends them unencoded — $arg__format is the raw query
	# value, and a correctly encoded `application/fhir+json` arrives percent-escaped. An
	# unrecognised value falls through to Accept, which is the right answer either way.
	"application/fhir+json"  ".json";
	"application/fhir+xml"   ".xml";
}

# A versioned snapshot is immutable by construction: hosting/deploy.sh refuses to overwrite one.
# The current release is republished on every deploy, so it may only be cached briefly.
map $uri $fhir_cache_control {
	default                             "public, max-age=300";
	"~^/fhir/[0-9]+\.[0-9]+\.[0-9]+/"   "public, max-age=31536000, immutable";
}
