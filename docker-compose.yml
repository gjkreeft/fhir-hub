services:
  fhir-hub:
    build: .
    ports:
      - "8080:8080"
    environment:
      # No credentials here: clients supply the practice id and license key
      # themselves, as HTTP Basic. fhir-hub holds no secrets of its own.
      PRESCRIPTOR_TARGET_URL: https://alfa.prescriptor-test.nl/api/prescriptor/xmlrpc_dispatch.php
      # Read-only G-Standaard reference lookup, for resolving current medication.
      GSTANDAARD_DB_URL: jdbc:mariadb://192.168.31.9:3306/gstandaard_views?serverTimezone=CET&useSSL=false
      GSTANDAARD_DB_USER: adapter
      GSTANDAARD_DB_PASSWORD: adapter
      LOG_LEVEL: INFO
